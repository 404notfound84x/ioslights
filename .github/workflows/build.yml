name: Build Lights

on:
  push:
  workflow_dispatch:
    inputs:
      server:
        description: "LED Studio address baked into the app, widgets and Control Center"
        default: "http://lights.local"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned; your sideloading app signs it)
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild -project Lights.xcodeproj -target Lights -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            LIGHTS_SERVER="${{ github.event.inputs.server || 'http://lights.local' }}" \
            build | grep -E "error:|warning: .*(Intents|Widgets|ContentView|LightsApp|LightsAPI)|BUILD|Compiling" || true
          test -d build/Release-iphoneos/Lights.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Lights.app Payload/
          echo "Embedded extensions:"; ls Payload/Lights.app/PlugIns
          zip -qry Lights.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Lights-ipa
          path: Lights.ipa
